[build]
  publish = "site"
  functions = "netlify/functions"

[build.environment]
  # These are public display names / a common-word username, not secrets.
  # Password variables remain covered by secrets scanning.
  SECRETS_SCAN_OMIT_KEYS = "NSTER_INITIAL_OWNER_NAME,NSTER_INITIAL_UPLOADER_DISPLAY_NAME,NSTER_INITIAL_UPLOADER_USERNAME"

[functions]
  node_bundler = "esbuild"
  included_files = ["java_practicals_1_to_35.json"]

[[redirects]]
  from = "/api/status"
  to = "/.netlify/functions/status"
  status = 200
  force = true

[[redirects]]
  from = "/api/session"
  to = "/.netlify/functions/session"
  status = 200
  force = true

[[redirects]]
  from = "/api/setup"
  to = "/.netlify/functions/setup"
  status = 200
  force = true

[[redirects]]
  from = "/api/visitor-auth"
  to = "/.netlify/functions/visitor-auth"
  status = 200
  force = true

[[redirects]]
  from = "/api/owner-auth"
  to = "/.netlify/functions/owner-auth"
  status = 200
  force = true

[[redirects]]
  from = "/api/questions"
  to = "/.netlify/functions/questions"
  status = 200
  force = true

[[redirects]]
  from = "/api/settings"
  to = "/.netlify/functions/settings"
  status = 200
  force = true

[[redirects]]
  from = "/api/contributors"
  to = "/.netlify/functions/contributors"
  status = 200
  force = true

[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests"
